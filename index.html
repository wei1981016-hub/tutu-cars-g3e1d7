<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#BFE5FF">
<meta name="robots" content="noindex, nofollow">
<title>图图认车车 · TuTu's Cars</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:"Yuanti SC","YouYuan",ui-rounded,"Hiragino Maru Gothic ProN","Chalkboard SE","Comic Sans MS","PingFang SC",system-ui,sans-serif;
  background:linear-gradient(180deg,#BFE5FF 0%,#E4F5FF 48%,#FFF4D8 100%);
  color:#2b4a6f;touch-action:manipulation;-webkit-touch-callout:none;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
svg{display:block}

.cloud{position:fixed;background:#fff;opacity:.55;border-radius:999px;pointer-events:none;z-index:0}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
#cloud1{width:150px;height:46px;top:7%;left:6%}
#cloud1::before{width:60px;height:60px;top:-26px;left:24px}
#cloud1::after{width:44px;height:44px;top:-18px;left:74px}
#cloud2{width:120px;height:38px;top:12%;right:8%}
#cloud2::before{width:48px;height:48px;top:-22px;left:20px}
#cloud2::after{width:36px;height:36px;top:-14px;left:60px}

#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 18px 24px;display:none}
.view.active{display:block}
#view-quiz.active{display:flex;flex-direction:column;justify-content:center}
#view-play.active{display:flex;flex-direction:column}
.view-title{font-size:20px;font-weight:800;color:#3a6ea5;margin:4px 6px 14px}

.v-svg{width:100%;height:auto}

/* ===== 图鉴 ===== */
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{background:#fff;border-radius:26px;padding:12px 10px 14px;box-shadow:0 5px 0 rgba(58,110,165,.13);
  position:relative;transition:transform .15s ease;text-align:center}
.card:active{transform:scale(.94)}
.card-name{display:block;font-size:22px;font-weight:900;color:#2b4a6f;margin-top:2px}
.card-en{display:block;font-size:14px;font-weight:700;color:#6b87a8;letter-spacing:.5px}

/* ===== 详情 ===== */
#detail{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;padding:12px;background:#FFFDF6}
#detail.open{display:flex}
.detail-close{position:absolute;top:14px;left:14px;width:66px;height:66px;border-radius:50%;background:#fff;
  box-shadow:0 5px 0 rgba(58,110,165,.18);display:flex;align-items:center;justify-content:center;z-index:2}
.detail-close:active{transform:scale(.9)}
.detail-close svg{width:30px;height:30px}
.detail-fig{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding-top:6px;cursor:pointer}
.detail-fig .v-svg{height:min(46vh,420px);width:auto;max-width:90vw}
.tap-hint{display:flex;align-items:center;justify-content:center;gap:8px;color:#E07B1F;font-size:17px;font-weight:800;
  animation:hintPulse 1.6s ease-in-out infinite}
.tap-hint svg{width:22px;height:22px}
@keyframes hintPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.08);opacity:1}}
.detail-info{text-align:center;padding:6px 16px calc(12px + env(safe-area-inset-bottom))}
.d-zh{font-size:clamp(32px,5.5vw,46px);font-weight:900;color:#27415e;display:inline-block}
.d-en{font-size:clamp(22px,4vw,30px);font-weight:800;color:#E07B1F;letter-spacing:1.5px;margin-left:14px;display:inline-block}
.d-desc{font-size:clamp(17px,2.8vw,22px);line-height:1.5;max-width:680px;margin:6px auto 0;color:#41608a}

/* ===== 找一找 ===== */
#quiz-q{display:flex;align-items:center;justify-content:center;gap:16px;margin:4px 0 22px}
.q-text{font-size:clamp(25px,4.5vw,36px);font-weight:900;color:#27415e}
.q-text b{color:#E07B1F}
.q-say{width:68px;height:68px;border-radius:50%;background:#4FA3F7;display:flex;align-items:center;justify-content:center;
  box-shadow:0 5px 0 #2f7fd4;flex:none}
.q-say:active{transform:translateY(3px);box-shadow:0 2px 0 #2f7fd4}
.q-say svg{width:32px;height:32px}
#quiz-opts{display:flex;gap:22px;justify-content:center;align-items:stretch;flex-wrap:wrap;padding:0 8px}
.opt{background:#fff;border-radius:30px;padding:16px 14px;width:min(39vw,340px);min-width:230px;
  box-shadow:0 6px 0 rgba(58,110,165,.14);border:5px solid transparent;transition:transform .15s ease}
.opt:active{transform:scale(.95)}
#quiz-opts.n3 .opt{width:min(29vw,300px);min-width:200px}
.opt.win{border-color:#48BB78;animation:pop .55s ease}
.opt.lose{animation:shake .5s ease;opacity:.55}
.opt.dim{opacity:.4;pointer-events:none}

/* 答对奖励横幅 */
#reward{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;pointer-events:none}
#reward.show{display:flex}
.reward-box{display:flex;flex-direction:column;align-items:center;gap:6px;animation:rewardPop 1.6s ease forwards}
.reward-box svg{width:130px;height:130px;filter:drop-shadow(0 6px 0 rgba(176,138,46,.35))}
.reward-txt{font-size:46px;font-weight:900;color:#E07B1F;text-shadow:0 3px 0 #fff}
@keyframes rewardPop{0%{transform:scale(.2);opacity:0}18%{transform:scale(1.15);opacity:1}30%{transform:scale(1)}
  78%{transform:scale(1);opacity:1}100%{transform:scale(1.1);opacity:0}}

/* ===== 玩一玩 ===== */
#scene-box{position:relative;flex:1;min-height:0;background:#fff;border-radius:26px;
  box-shadow:0 5px 0 rgba(58,110,165,.13);overflow:hidden}
#scene-svg{width:100%;height:100%}
#scene-q{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;
  padding:10px 14px;background:rgba(255,255,255,.88)}
#scene-q .q-say{width:54px;height:54px}
#scene-q .q-say svg{width:26px;height:26px}
#s-text{font-size:clamp(17px,2.6vw,24px);font-weight:900;color:#27415e;line-height:1.3}
#scene-vehicle{position:absolute;bottom:0;left:0;width:200px;pointer-events:none;
  transform:translateX(-150vw);transition:transform 2s ease}
#play-opts{display:flex;gap:16px;justify-content:center;padding:14px 6px 4px;flex:none}
.p-opt{background:#fff;border-radius:22px;padding:10px;width:min(27vw,220px);min-width:150px;
  box-shadow:0 5px 0 rgba(58,110,165,.14);border:4px solid transparent;position:relative;touch-action:none}
.p-opt.dragging{opacity:.3}
.p-opt.gone{visibility:hidden}
.p-opt.wiggle{animation:shake .5s ease}
.p-opt .p-name{display:block;text-align:center;font-size:16px;font-weight:800;color:#41608a;margin-top:2px}
#ghost{position:fixed;z-index:90;width:170px;pointer-events:none;display:none;filter:drop-shadow(0 8px 10px rgba(45,55,72,.3))}
#ghost.back{transition:left .35s ease,top .35s ease}
.prop.solved{animation:solveFade 1.2s ease forwards}
@keyframes solveFade{to{opacity:0;transform:scale(.6)}}
.stars{opacity:0}
.stars.show{opacity:1}
.stars.show path{animation:starTwinkle 1s ease-in-out infinite alternate}
@keyframes starTwinkle{from{opacity:.5}to{opacity:1}}
.flame{animation:flick .45s ease-in-out infinite alternate;transform-origin:center bottom;transform-box:fill-box}
@keyframes flick{from{transform:scaleY(.85) scaleX(1.05)}to{transform:scaleY(1.1) scaleX(.95)}}
.dustc{animation:dustFloat 2.4s ease-in-out infinite alternate}
@keyframes dustFloat{from{transform:translateX(0)}to{transform:translateX(10px)}}

/* ===== 导航 ===== */
nav#tabs{display:flex;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:#fff;box-shadow:0 -5px 18px rgba(58,110,165,.12);z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:9px 4px;border-radius:20px;color:#7d96b5;font-weight:800;font-size:15px;min-height:68px;transition:transform .12s ease}
.tab svg{width:32px;height:32px}
.tab:active{transform:scale(.93)}
.tab.active{color:#E07B1F;background:#FFE9C9}

/* ===== 开始页 ===== */
#start{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;background:linear-gradient(180deg,#BFE5FF 0%,#E4F5FF 55%,#FFF4D8 100%);padding:20px;text-align:center}
#start h1{font-size:clamp(36px,7vw,60px);font-weight:900;color:#2B6CB0;margin:0;text-shadow:0 4px 0 rgba(255,255,255,.9)}
#start .sub{font-size:clamp(17px,3vw,24px);font-weight:800;color:#E07B1F;letter-spacing:2px;margin:2px 0 8px}
#start .hero{width:min(52vw,380px)}
#btn-start{margin-top:16px;background:#FF8A3D;color:#fff;font-size:clamp(26px,4.5vw,34px);font-weight:900;
  padding:18px 58px;border-radius:999px;box-shadow:0 8px 0 #d96a1e;display:flex;align-items:center;gap:14px}
#btn-start:active{transform:translateY(5px);box-shadow:0 3px 0 #d96a1e}
#btn-start svg{width:30px;height:30px}
#start .hint{margin-top:16px;font-size:14px;color:#7d96b5;font-weight:700}

#fx{position:fixed;inset:0;pointer-events:none;z-index:80}

/* ===== 车辆常驻动画（.animate 容器内） ===== */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rock{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-6deg)}}
@keyframes wobble{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-3deg)}}
@keyframes hookdown{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
@keyframes blinkA{0%,44%{opacity:1}50%,94%{opacity:.15}100%{opacity:1}}
@keyframes blinkB{0%,44%{opacity:.15}50%,94%{opacity:1}100%{opacity:.15}}
@keyframes spray{0%{opacity:0;transform:translate(0,-3px)}30%{opacity:1}100%{opacity:0;transform:translate(6px,9px)}}
@keyframes smoke{0%{opacity:.95;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-20px) scale(1.35)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.13)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.animate .v-svg{animation:bob 2.4s ease-in-out infinite}
.animate .wheel{animation:spin 3.2s linear infinite}
.animate .part-arm,.animate .part-sway{animation:rock 3s ease-in-out infinite}
.animate .drum-roll{animation:drumTurn 1.6s linear infinite}
.animate .part-hook{animation:hookdown 3s ease-in-out infinite}
.animate .part-water{animation:spray 1s linear infinite}
.animate .part-smoke{animation:smoke 1.4s ease-out infinite}
.animate .light-a{animation:blinkA 1s steps(1) infinite}
.animate .light-b{animation:blinkB 1s steps(1) infinite}

/* ===== 互动动作（点车触发，一次性） ===== */
@keyframes digOnce{0%{transform:rotate(0)}30%{transform:rotate(17deg)}50%{transform:rotate(19deg)}80%{transform:rotate(-6deg)}100%{transform:rotate(0)}}
@keyframes tiltOnce{0%,100%{transform:rotate(0)}35%{transform:rotate(-24deg)}70%{transform:rotate(-24deg)}}
@keyframes driveOnce{0%,100%{transform:translateX(0)}35%{transform:translateX(-16px)}65%{transform:translateX(-16px)}}
@keyframes bladeDip{0%,100%{transform:translateY(0)}30%{transform:translateY(6px)}65%{transform:translateY(6px)}}
@keyframes curlOnce{0%,100%{transform:rotate(0)}40%{transform:rotate(26deg)}65%{transform:rotate(20deg)}}
@keyframes drumTurn{to{transform:translateX(-24px)}}
@keyframes scoopOnce{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}55%{transform:rotate(14deg)}80%{transform:rotate(12deg)}}
@keyframes liftOnce{0%,100%{transform:translateY(0)}40%{transform:translateY(-30px)}75%{transform:translateY(-30px)}}
@keyframes dropOnce{0%,100%{transform:translateY(0)}40%{transform:translateY(22px)}75%{transform:translateY(20px)}}
@keyframes ladderOnce{0%,100%{transform:rotate(0)}40%{transform:rotate(-16deg)}75%{transform:rotate(-16deg)}}
@keyframes extendOnce{0%,100%{transform:translateX(0)}40%{transform:translateX(-26px)}75%{transform:translateX(-26px)}}
@keyframes swayOnce{0%,100%{transform:rotate(0)}30%{transform:rotate(8deg)}65%{transform:rotate(-6deg)}}
@keyframes lidOnce{0%,100%{transform:rotate(0)}35%{transform:rotate(-38deg)}70%{transform:rotate(-38deg)}}
@keyframes doorOnce{0%,100%{transform:scaleX(1)}35%{transform:scaleX(.15)}70%{transform:scaleX(.15)}}
@keyframes spinFastK{to{transform:rotate(360deg)}}
@keyframes flashFast{0%,100%{opacity:1}25%{opacity:.1}50%{opacity:1}75%{opacity:.1}}
@keyframes trolleyOnce{0%,100%{transform:translateX(0)}40%{transform:translateX(-46px)}75%{transform:translateX(-46px)}}
@keyframes fxFall{0%{opacity:0;transform:translate(0,-6px)}25%{opacity:1}100%{opacity:0;transform:translate(9px,30px)}}
@keyframes fxPour{0%{opacity:0}30%{opacity:1}100%{opacity:0;transform:translateY(18px)}}
.fx{opacity:0}
.acting .v-svg{animation:bob .5s ease-in-out 4}
.acting[data-vid="excavator"] .part-arm{animation:digOnce 2.4s ease-in-out 1}
.acting[data-vid="excavator"] .part-bucket{animation:curlOnce 2.4s ease-in-out 1}
.acting[data-vid="excavator"] .fx-dig{animation:fxFall .8s ease-in .9s 2}
.acting[data-vid="bulldozer"] .v-svg{animation:driveOnce 2.4s ease-in-out 1}
.acting[data-vid="bulldozer"] .part-blade{animation:bladeDip 2.4s ease-in-out 1}
.acting[data-vid="bulldozer"] .fx-dirt{animation:fxFall .8s ease-in .5s 2}
.acting[data-vid="loader"] .part-scoop{animation:scoopOnce 2.2s ease-in-out 1}
.acting[data-vid="loader"] .fx-dirt{animation:fxFall .8s ease-in .7s 2}
.acting[data-vid="crane"] .part-hook{animation:dropOnce 2.4s ease-in-out 1}
.acting[data-vid="towercrane"] .part-trolley{animation:trolleyOnce 2.6s ease-in-out 1}
.acting[data-vid="dumptruck"] .part-bed{animation:tiltOnce 2.6s ease-in-out 1}
.acting[data-vid="dumptruck"] .fx-dirt{animation:fxFall .8s ease-in .8s 2}
.acting[data-vid="mixer"] .drum-roll{animation:drumTurn .45s linear infinite}
.acting[data-vid="roller"] .wheel{animation:spinFastK .5s linear 5}
.acting[data-vid="roller"] .v-svg{animation:driveOnce 2.4s ease-in-out 1}
.acting[data-vid="forklift"] .part-fork{animation:liftOnce 2.6s ease-in-out 1}
.acting[data-vid="pumptruck"] .part-sway{animation:swayOnce 2.4s ease-in-out 1}
.acting[data-vid="pumptruck"] .fx-pour{animation:fxPour .8s ease-in .8s 2}
.acting[data-vid="grader"] .v-svg{animation:driveOnce 2.4s ease-in-out 1}
.acting[data-vid="grader"] .part-blade{animation:bladeDip 2.4s ease-in-out 1}
.acting[data-vid="miningtruck"] .part-bed{animation:tiltOnce 2.8s ease-in-out 1}
.acting[data-vid="miningtruck"] .fx-rock{animation:fxFall .9s ease-in .9s 2}
.acting[data-vid="firetruck"] .part-ladder{animation:ladderOnce 2.8s ease-in-out 1}
.acting[data-vid="firetruck"] .part-ladder2{animation:extendOnce 2.8s ease-in-out 1}
.acting[data-vid="firetruck"] .light-a{animation:flashFast .5s linear 5}
.acting[data-vid="policecar"] .light-a{animation:flashFast .4s linear 6}
.acting[data-vid="policecar"] .light-b{animation:flashFast .4s linear .2s 6}
.acting[data-vid="ambulance"] .light-a{animation:flashFast .4s linear 6}
.acting[data-vid="bus"] .part-door{animation:doorOnce 2.4s ease-in-out 1;transform-origin:left center;transform-box:fill-box}
.acting[data-vid="garbagetruck"] .part-lid{animation:lidOnce 2.4s ease-in-out 1}
.acting[data-vid="watertruck"] .part-water{animation:spray .5s linear 5}
.acting[data-vid="schoolbus"] .part-sign{animation:swayOnce 2.4s ease-in-out 1}
.acting[data-vid="schoolbus"] .light-a,.acting[data-vid="schoolbus"] .light-b{animation:flashFast .5s linear 5}
.acting[data-vid="tractor"] .part-smoke{animation:smoke .6s ease-out 4}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (max-width:560px){
  #grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}
  .opt,#quiz-opts.n3 .opt{width:min(86vw,320px)}
  .card-name{font-size:19px}
  #play-opts{gap:10px}
  .p-opt{min-width:104px;width:30vw}
  .p-opt .p-name{font-size:13px}
}
</style>
</head>
<body>
<div class="cloud" id="cloud1"></div>
<div class="cloud" id="cloud2"></div>
<canvas id="fx"></canvas>

<div id="app">
  <main>
    <section id="view-book" class="view active" aria-label="认一认">
      <h1 class="view-title">点一点，认识车车！</h1>
      <div id="grid"></div>
    </section>

    <section id="view-quiz" class="view" aria-label="找一找">
      <div id="quiz-q">
        <button class="q-say" id="btn-q-say" aria-label="再听一遍题目"></button>
        <div class="q-text">哪一个是 <b id="q-name"></b>？</div>
      </div>
      <div id="quiz-opts"></div>
    </section>

    <section id="view-play" class="view" aria-label="玩一玩">
      <div id="scene-box">
        <svg id="scene-svg" viewBox="0 0 420 230" preserveAspectRatio="xMidYMax slice"></svg>
        <div id="scene-vehicle"></div>
        <div id="scene-q">
          <button class="q-say" id="btn-s-say" aria-label="再听一遍"></button>
          <div id="s-text"></div>
        </div>
      </div>
      <div id="play-opts"></div>
    </section>
  </main>

  <nav id="tabs">
    <button class="tab active" data-view="book" aria-label="认一认"></button>
    <button class="tab" data-view="quiz" aria-label="找一找"></button>
    <button class="tab" data-view="play" aria-label="玩一玩"></button>
  </nav>
</div>

<div id="detail" role="dialog" aria-modal="true">
  <button class="detail-close" id="btn-close" aria-label="关闭"></button>
  <div class="detail-fig animate" id="d-fig"></div>
  <div class="tap-hint" id="tap-hint"></div>
  <div class="detail-info">
    <div><span class="d-zh" id="d-zh"></span><span class="d-en" id="d-en"></span></div>
    <div class="d-desc" id="d-desc"></div>
  </div>
</div>

<div id="reward"><div class="reward-box" id="reward-box"></div></div>
<div id="ghost"></div>

<div id="start">
  <h1 id="start-title">认车车</h1>
  <div class="sub" id="start-sub">认识车车学英语</div>
  <div class="hero animate" id="start-hero"></div>
  <button id="btn-start"><span class="ic"></span>开始玩</button>
  <div class="hint">建议 iPad 横屏 · 打开声音一起玩</div>
</div>

<script>
'use strict';
/* ===== 宝宝名字（make_gift.py 生成定制版时会替换下面两行） ===== */
const KID_NAME = '图图';
const KID_EN = 'TuTu';

/* ================= 小图标 ================= */
const IC = (p, f) => '<svg viewBox="0 0 24 24" fill="' + (f || 'none') +
  '" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';
const ICONS = {
  book: IC('<path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/>'),
  search: IC('<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>'),
  game: IC('<line x1="6" y1="11" x2="10" y2="11"/><line x1="8" y1="9" x2="8" y2="13"/><line x1="15" y1="12" x2="15.01" y2="12"/><line x1="18" y1="10" x2="18.01" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.152A4 4 0 0 0 17.32 5z"/>'),
  speaker: IC('<path d="M11 5 6 9H2v6h4l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>'),

/* ================= 车辆零件库 ================= */
function W(cx, cy, r, hub) {
  hub = hub || '#C8D2DE';
  let s = '<g class="wheel" style="transform-origin:' + cx + 'px ' + cy + 'px">';
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#1B232E"/>';
  for (let i = 0; i < 8; i++) {
    s += '<rect x="' + (cx - 1.8) + '" y="' + (cy - r) + '" width="3.6" height="' + (r * .2) +
      '" rx="1.4" fill="#0B1118" transform="rotate(' + i * 45 + ' ' + cx + ' ' + cy + ')"/>';
  }
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r * .60 + '" fill="#E8EDF3"/>';
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r * .48 + '" fill="' + hub + '"/>';
  for (let i = 0; i < 6; i++) {
    s += '<circle cx="' + cx + '" cy="' + (cy - r * .32) + '" r="' + Math.max(1.4, r * .07) +
      '" fill="#5A6B82" transform="rotate(' + i * 60 + ' ' + cx + ' ' + cy + ')"/>';
  }
  s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r * .15 + '" fill="#39434F"/></g>';
  return s;
}
function TRACKS(x, y, w, h) {
  const r = h / 2;
  let s = '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + r + '" fill="#232B36"/>';
  for (let cx = x + 6; cx < x + w - 4; cx += 11) {
    s += '<rect x="' + cx + '" y="' + (y + h - 3) + '" width="5" height="5" rx="2" fill="#0B1118"/>';
  }
  s += '<circle cx="' + (x + r) + '" cy="' + (y + r) + '" r="' + r * .55 + '" fill="#8D9AAB"/>' +
       '<circle cx="' + (x + r) + '" cy="' + (y + r) + '" r="' + r * .22 + '" fill="#39434F"/>' +
       '<circle cx="' + (x + w - r) + '" cy="' + (y + r) + '" r="' + r * .55 + '" fill="#8D9AAB"/>' +
       '<circle cx="' + (x + w - r) + '" cy="' + (y + r) + '" r="' + r * .22 + '" fill="#39434F"/>';
  const n = 3, step = (w - 2 * h) / (n + 1);
  for (let i = 1; i <= n; i++) {
    const cx = x + h + step * i;
    s += '<circle cx="' + cx + '" cy="' + (y + h * .62) + '" r="' + h * .2 + '" fill="#8D9AAB"/>' +
         '<circle cx="' + cx + '" cy="' + (y + h * .62) + '" r="' + h * .08 + '" fill="#39434F"/>';
  }
  return s;
}
function GLASS(x, y, w, h, r) {
  return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (r || 4) +
    '" fill="#8FD0F5" stroke="#FFFFFF" stroke-width="3"/>' +
    '<polygon points="' + (x + w * .18) + ',' + (y + h) + ' ' + (x + w * .42) + ',' + y + ' ' +
    (x + w * .56) + ',' + y + ' ' + (x + w * .32) + ',' + (y + h) + '" fill="#FFFFFF" opacity=".4"/>';
}
function HYD(x1, y1, x2, y2) {
  const mx = x1 + (x2 - x1) * .55, my = y1 + (y2 - y1) * .55;
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + mx + '" y2="' + my + '" stroke="#39434F" stroke-width="7" stroke-linecap="round"/>' +
         '<line x1="' + mx + '" y1="' + my + '" x2="' + x2 + '" y2="' + y2 + '" stroke="#AEB9C6" stroke-width="3.5" stroke-linecap="round"/>';
}
function EXH(x, y, h) {
  return '<rect x="' + x + '" y="' + (y - h) + '" width="6" height="' + h + '" rx="2" fill="#39434F"/>' +
         '<rect x="' + (x - 1.5) + '" y="' + (y - h - 4) + '" width="9" height="5" rx="2" fill="#39434F"/>';
}
function BEACON(cx, y) {
  return '<rect x="' + (cx - 6) + '" y="' + (y - 3) + '" width="12" height="3.5" rx="1.5" fill="#39434F"/>' +
         '<path class="light-a" d="M' + (cx - 4.5) + ' ' + (y - 3) + ' v-4 q4.5 -4.5 9 0 v4 z" fill="#FFB020"/>';
}
const SHADOW = '<ellipse cx="100" cy="128" rx="76" ry="6" fill="rgba(45,55,72,.13)"/>';

let SVG_UID = 0;
function svgOf(v) {
  /* __UID__ 占位符替换成全局唯一值，避免同一车辆多处渲染时 clipPath id 冲突 */
  const u = 'u' + (++SVG_UID);
  return '<svg class="v-svg" viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    SHADOW + v.body.split('__UID__').join(u) + '</svg>';
}

/* ================= 音效（WebAudio 合成） ================= */
const Sfx = {
  ctx:null, noiseBuf:null,
  init() {
    if (!this.ctx) {
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        const len = this.ctx.sampleRate, buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        this.noiseBuf = buf;
      } catch (e) {}
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  now() { return this.ctx ? this.ctx.currentTime : 0; },
  note(f, t, d, type, g) {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), v = this.ctx.createGain();
    o.type = type || 'triangle'; o.frequency.value = f;
    v.gain.setValueAtTime(0.0001, t);
    v.gain.exponentialRampToValueAtTime(g || 0.12, t + 0.02);
    v.gain.exponentialRampToValueAtTime(0.0001, t + (d || 0.18));
    o.connect(v); v.connect(this.ctx.destination);
    o.start(t); o.stop(t + (d || 0.18) + 0.05);
  },
  noise(t, d, g, fc) {
    if (!this.ctx) return;
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = fc || 1200; f.Q.value = .8;
    const v = this.ctx.createGain();
    v.gain.setValueAtTime(0.0001, t);
    v.gain.exponentialRampToValueAtTime(g || 0.1, t + 0.03);
    v.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(v); v.connect(this.ctx.destination);
    s.start(t); s.stop(t + d + 0.05);
  },
  tap() { this.note(660, this.now(), 0.1, 'triangle', 0.07); },
  good() { const t = this.now(); [523,659,784,1047].forEach((f,i)=>this.note(f, t+i*0.11, 0.22, 'triangle', 0.13)); },
  bad() { const t = this.now(); this.note(392, t, 0.16, 'sine', 0.07); this.note(330, t+0.17, 0.24, 'sine', 0.07); },
  fanfare() { const t = this.now(); [523,659,784,1047,784,1047,1319].forEach((f,i)=>this.note(f, t+i*0.13, 0.26, 'triangle', 0.14)); },
  siren() {
    if (!this.ctx) return; const t = this.now();
    const o = this.ctx.createOscillator(), v = this.ctx.createGain();
    o.type = 'triangle';
    for (let i = 0; i < 6; i++) o.frequency.setValueAtTime(i % 2 ? 600 : 850, t + i * 0.34);
    v.gain.setValueAtTime(0.08, t); v.gain.setValueAtTime(0.08, t + 1.9);
    v.gain.exponentialRampToValueAtTime(0.0001, t + 2.1);
    o.connect(v); v.connect(this.ctx.destination); o.start(t); o.stop(t + 2.15);
  },
  dig() { const t = this.now(); this.noise(t, .4, .12, 500); this.note(90, t+.32, .3, 'sine', .16); this.noise(t+.55, .35, .1, 400); },
  splash() { const t = this.now(); this.noise(t, .8, .12, 2400); this.noise(t+.3, .8, .1, 1800); },
  pour() { const t = this.now(); this.noise(t, 1.1, .12, 700); this.note(110, t+.2, .5, 'sine', .08); },
  spin() { const t = this.now(); for (let i = 0; i < 8; i++) this.note(420 + (i%2)*60, t+i*.12, .08, 'square', .04); },
  putt() { const t = this.now(); for (let i = 0; i < 6; i++) this.note(105, t+i*.16, .09, 'square', .1); },
  beep() { const t = this.now(); this.note(988, t, .14, 'square', .06); this.note(988, t+.22, .14, 'square', .06); },
  ding() { const t = this.now(); this.note(1319, t, .3, 'sine', .1); this.note(1568, t+.18, .4, 'sine', .08); },
  play(name) { this.init(); (this[name] || this.tap).call(this); }
};

/* ================= 语音：音频文件优先，系统 TTS 兜底 ================= */
const Speech = {
  zhVoice:null, enVoice:null, ok:('speechSynthesis' in window),
  init() {
    if (!this.ok) return;
    const pick = () => {
      const vs = speechSynthesis.getVoices();
      this.zhVoice = vs.find(v => /^zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
      this.enVoice = vs.find(v => /^en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
    };
    pick();
    if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = pick;
  },
  stop() { if (this.ok) speechSynthesis.cancel(); },
  /* 朗读单条，返回 Promise（Chrome 的 cancel→speak 需要隔一拍，否则静音） */
  one(text, lang) {
    return new Promise(res => {
      if (!this.ok) { res(); return; }
      setTimeout(() => {
        const u = new SpeechSynthesisUtterance(text);
        const en = lang === 'en';
        u.lang = en ? 'en-US' : 'zh-CN';
        const v = en ? this.enVoice : this.zhVoice;
        if (v) u.voice = v;
        u.rate = en ? 0.8 : 0.9; u.pitch = 1.1;
        let done = false;
        const fin = () => { if (!done) { done = true; res(); } };
        u.onend = fin; u.onerror = fin;
        setTimeout(fin, 1000 + text.length * 450);
        speechSynthesis.speak(u);
      }, 90);
    });
  }
};
const Voice = {
  token:0, cur:null, cache:{}, missing:{},
  stop() {
    this.token++;
    if (this.cur) { try { this.cur.pause(); } catch (e) {} this.cur = null; }
    Speech.stop();
  },
  /* item: {k:音频文件key, t:文本, lang:'zh'|'en'} */
  playOne(item) {
    return new Promise(res => {
      if (this.missing[item.k]) { Speech.one(item.t, item.lang).then(res); return; }
      let a = this.cache[item.k];
      if (!a) { a = new Audio('audio/' + item.k + '.mp3'); a.preload = 'auto'; this.cache[item.k] = a; }
      this.cur = a;
      let done = false;
      const fin = () => { if (!done) { done = true; this.cur = null; res(); } };
      const fallback = () => { if (!done) { done = true; this.cur = null; Speech.one(item.t, item.lang).then(res); } };
      a.onended = fin;
      /* 资源真加载失败（404等）才记为缺失，永久走TTS */
      a.onerror = () => { this.missing[item.k] = 1; fallback(); };
      try { a.currentTime = 0; } catch (e) {}
      /* play被自动播放策略等临时拦截：本次回退TTS，但不标记缺失 */
      a.play().catch(fallback);
    });
  },
  async say(items) {
    this.stop();
    const t = this.token;
    for (const it of items) {
      if (t !== this.token) return;
      await this.playOne(it);
      if (t !== this.token) return;
      await new Promise(r => setTimeout(r, 160));
    }
  }
};
const L = {
  welcome:'你好呀！欢迎来到' + KID_NAME + '认车车！点一点，认识好多车车吧！',
  try_again:'哎呀，再试试！',
  play_hint:'用小手把车车拖到上面的画里，试试看！',
  play_wrong:'再想想，应该开哪辆车呢？',
  praise:['太棒了！','真厉害！','答对啦！', KID_NAME + '真棒！','好聪明呀！']
};

/* ================= 彩带 / 烟花 ================= */
const FX = {
  cv:null, cx:null, parts:[], running:false,
  colors:['#FF5D5D','#FF8A3D','#FFD23E','#48BB78','#4FA3F7','#9F7AEA','#F687B3'],
  reduced:window.matchMedia('(prefers-reduced-motion: reduce)').matches,
  init() {
    this.cv = $('#fx'); this.cx = this.cv.getContext('2d');
    const fit = () => {
      const d = Math.min(window.devicePixelRatio || 1, 2);
      this.cv.width = innerWidth * d; this.cv.height = innerHeight * d;
      this.cx.setTransform(d, 0, 0, d, 0, 0);
    };
    fit(); addEventListener('resize', fit);
  },
  burst(x, y, n) {
    if (this.reduced) n = Math.min(n, 12);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 6;
      this.parts.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 3,
        size:5 + Math.random()*6, rot:Math.random()*Math.PI, vr:(Math.random()-.5)*.3, life:1,
        color:this.colors[(Math.random()*this.colors.length)|0], round:Math.random()<.4 });
    }
    if (!this.running) { this.running = true; requestAnimationFrame(() => this.step()); }
  },
  fireworks() {
    const pts = [[.5,.3],[.25,.4],[.75,.35],[.4,.25],[.65,.45]];
    pts.forEach((p,i)=>setTimeout(()=>this.burst(innerWidth*p[0], innerHeight*p[1], 55), i*350));
  },
  step() {
    const c = this.cx;
    c.clearRect(0, 0, innerWidth, innerHeight);
    this.parts = this.parts.filter(p => p.life > 0);
    for (const p of this.parts) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.rot += p.vr; p.life -= 0.012;
      c.save(); c.globalAlpha = Math.max(0, p.life);
      c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.color;
      if (p.round) { c.beginPath(); c.arc(0, 0, p.size/2, 0, 7); c.fill(); }
      else c.fillRect(-p.size/2, -p.size/3, p.size, p.size*.66);
      c.restore();
    }
    if (this.parts.length) requestAnimationFrame(() => this.step());
    else { this.running = false; c.clearRect(0, 0, innerWidth, innerHeight); }
  }
};

/* ================= 认一认 ================= */
function renderGrid() {
  $('#grid').innerHTML = VEHICLES.map(v =>
    '<button class="card" data-id="' + v.id + '" aria-label="' + v.zh + ' ' + v.en + '">' +
      svgOf(v) +
      '<span class="card-name">' + v.zh + '</span>' +
      '<span class="card-en">' + v.en + '</span>' +
    '</button>').join('');
}
function openDetail(id) {
  const v = byId(id);
  if (!v) return;
  Sfx.play('tap');
  const fig = $('#d-fig');
  fig.innerHTML = svgOf(v);
  fig.dataset.vid = id;
  fig.classList.remove('acting');
  $('#d-zh').textContent = v.zh;
  $('#d-en').textContent = v.en;
  $('#d-desc').textContent = v.desc;
  $('#detail').style.background = 'linear-gradient(180deg,' + v.color + '33 0%, #FFFDF6 70%) #FFFDF6';
  $('#detail').classList.add('open');
  $('#detail').dataset.id = id;
  Voice.say([
    { k:'n_' + id, t:v.zh, lang:'zh' },
    { k:'e_' + id, t:v.en, lang:'en' },
    { k:'e_' + id, t:v.en, lang:'en' },
    { k:'d_' + id, t:v.desc, lang:'zh' }
  ]);
}
function doAction() {
  const id = $('#detail').dataset.id, v = byId(id);
  if (!v) return;
  const fig = $('#d-fig');
  fig.classList.remove('acting');
  void fig.offsetWidth;
  fig.classList.add('acting');
  Sfx.play(v.act.sfx);
  Voice.say([{ k:'a_' + id, t:v.act.line, lang:'zh' }]);
  setTimeout(() => fig.classList.remove('acting'), 3000);
}
function closeDetail() {
  Sfx.play('tap'); Voice.stop();
  $('#detail').classList.remove('open');
}

/* ================= 找一找 ================= */
function pickTarget() {
  let v, guard = 0;
  do { v = VEHICLES[(Math.random() * VEHICLES.length) | 0]; }
  while (v.id === state.lastTarget && ++guard < 20);
  state.lastTarget = v.id;
  return v;
}
function newQuiz() {
  clearTimeout(state.nextTimer);
  state.busy = false;
  const target = pickTarget();
  state.target = target.id;
  const nOpts = state.wins >= 4 ? 3 : 2;
  const others = VEHICLES.filter(v => v.id !== target.id);
  const opts = [target];
  while (opts.length < nOpts) opts.push(others.splice((Math.random()*others.length)|0, 1)[0]);
  opts.sort(() => Math.random() - 0.5);
  $('#q-name').textContent = target.zh;
  const box = $('#quiz-opts');
  box.className = nOpts === 3 ? 'n3' : '';
  box.innerHTML = opts.map(v => '<button class="opt" data-id="' + v.id + '" aria-label="选项"></button>').join('');
  box.querySelectorAll('.opt').forEach((el, i) => { el.innerHTML = svgOf(opts[i]); });
  askQuiz();
}
function askQuiz() {
  const v = byId(state.target);
  if (v) Voice.say([{ k:'q_' + v.id, t:'找一找，哪一个是' + v.zh + '？', lang:'zh' }]);
}
function showReward() {
  const box = $('#reward-box');
  box.innerHTML = ICONS.bigstar + '<div class="reward-txt">' +
    L.praise[(Math.random()*L.praise.length)|0] + '</div>';
  const r = $('#reward');
  r.classList.add('show');
  setTimeout(() => r.classList.remove('show'), 1650);
}
function onPick(el) {
  if (state.busy) return;
  const id = el.dataset.id, v = byId(id), target = byId(state.target);
  if (!v || !target) return;
  if (id === state.target) {
    state.busy = true;
    state.wins++;
    el.classList.add('win');
    el.parentElement.querySelectorAll('.opt').forEach(o => { if (o !== el) o.classList.add('dim'); });
    Sfx.play('good');
    const r = el.getBoundingClientRect();
    FX.burst(r.left + r.width/2, r.top + r.height/3, 70);
    showReward();
    const pi = (Math.random()*L.praise.length)|0;
    Voice.say([
      { k:'praise_' + pi, t:L.praise[pi], lang:'zh' },
      { k:'n_' + id, t:target.zh, lang:'zh' },
      { k:'e_' + id, t:target.en, lang:'en' }
    ]);
    state.nextTimer = setTimeout(() => {
      if ($('#view-quiz').classList.contains('active')) newQuiz();
    }, 3400);
  } else {
    el.classList.remove('lose'); void el.offsetWidth; el.classList.add('lose');
    Sfx.play('bad');
    Voice.say([
      { k:'w_' + id, t:'这是' + v.zh + '，', lang:'zh' },
      { k:'q_' + target.id, t:'找一找，哪一个是' + target.zh + '？', lang:'zh' }
    ]);
  }
}

/* ================= 玩一玩（拖拽场景） ================= */
const SCENE_BASE =
  '<rect width="420" height="230" fill="#E9F6FF"/>' +
  '<circle cx="58" cy="46" r="22" fill="#FFD23E"/><circle cx="58" cy="46" r="28" fill="#FFD23E" opacity=".3"/>' +
  '<rect x="0" y="168" width="420" height="62" fill="#A8B8AC"/>' +
  '<rect x="0" y="168" width="420" height="10" fill="#8FA293"/>' +
  '<rect x="0" y="196" width="420" height="5" rx="2.5" fill="#fff" opacity=".7"/>';
const SCENE_ROAD =
  '<rect width="420" height="230" fill="#E9F6FF"/>' +
  '<circle cx="58" cy="46" r="22" fill="#FFD23E"/><circle cx="58" cy="46" r="28" fill="#FFD23E" opacity=".3"/>' +
  '<rect x="0" y="150" width="420" height="80" fill="#8D9AAB"/>' +
  '<rect x="0" y="150" width="420" height="8" fill="#7B8794"/>' +
  '<path d="M10 192 h36 M70 192 h36 M130 192 h36 M190 192 h36 M250 192 h36 M310 192 h36 M370 192 h36" stroke="#fff" stroke-width="5" stroke-dasharray="26 24"/>';
const ROAD_SCENES = { thief:1, dusty:1, bumpy:1, trash:1, sick:1 };

function nextScene() {
  if (!state.sceneQueue.length) {
    state.sceneQueue = SCENES.map((s,i)=>i).sort(()=>Math.random()-0.5);
  }
  const sc = SCENES[state.sceneQueue.shift()];
  state.scene = sc;
  state.playBusy = false;
  const base = ROAD_SCENES[sc.id] ? SCENE_ROAD : SCENE_BASE;
  const stars = '<g class="stars" id="scene-stars">' +
    '<path d="m120 60 4 8 9 1-6.5 6 1.5 9-8-4.5-8 4.5 1.5-9-6.5-6 9-1z" fill="#FFD23E"/>' +
    '<path d="m340 44 3 6 7 1-5 4.6 1.2 7-6.2-3.5-6.2 3.5 1.2-7-5-4.6 7-1z" fill="#FFD23E"/>' +
    '<path d="m250 70 2.6 5.2 6 .8-4.3 4 1 6-5.3-3-5.3 3 1-6-4.3-4 6-.8z" fill="#FFB020"/></g>';
  $('#scene-svg').innerHTML = base + sc.art + stars;
  $('#s-text').textContent = sc.q;
  const sv = $('#scene-vehicle');
  sv.innerHTML = ''; sv.classList.remove('animate','acting');
  sv.style.transition = 'none'; sv.style.transform = 'translateX(-150vw)';
  const correct = byId(sc.v);
  const others = VEHICLES.filter(v => v.id !== sc.v && sc.exclude.indexOf(v.id) < 0);
  const opts = [correct];
  while (opts.length < 3) opts.push(others.splice((Math.random()*others.length)|0, 1)[0]);
  opts.sort(() => Math.random() - 0.5);
  $('#play-opts').innerHTML = opts.map(v =>
    '<div class="p-opt" data-id="' + v.id + '" aria-label="' + v.zh + '">' + svgOf(v) +
    '<span class="p-name">' + v.zh + '</span></div>').join('');
  askScene();
}
function askScene() {
  const sc = state.scene;
  if (sc) Voice.say([{ k:'s_' + sc.id, t:sc.q, lang:'zh' }]);
}
function sceneWin(optEl) {
  const sc = state.scene, v = byId(sc.v);
  state.playBusy = true;
  optEl.classList.add('gone');
  document.querySelectorAll('.p-opt').forEach(o => { if (o !== optEl) o.style.opacity = .35; });
  const sv = $('#scene-vehicle');
  sv.innerHTML = svgOf(v);
  sv.dataset.vid = sc.v;
  sv.classList.add('animate');
  /* 按场景SVG的实际缩放（viewBox 420x230, slice 底对齐）给车定尺寸和落点，
     让车和场景里的房子、人物比例匹配：车宽≈160个场景单位，车底落在 y≈214，
     停在出事地点（x≈240 单位）的左边 */
  const box = $('#scene-box').getBoundingClientRect();
  const scale = Math.max(box.width / 420, box.height / 230);
  const W = 160 * scale;
  sv.style.width = W + 'px';
  sv.style.bottom = (16 * scale) + 'px';
  sv.style.transition = 'none';
  sv.style.transform = 'translateX(' + (-W - 80) + 'px)';
  void sv.offsetWidth;
  sv.style.transition = 'transform 2s ease';
  const leftPx = box.width / 2 - 210 * scale + 75 * scale;
  /* 用 setTimeout 而非 rAF：后台/节流环境下 rAF 可能长时间不触发 */
  setTimeout(() => { sv.style.transform = 'translateX(' + leftPx + 'px)'; }, 60);
  Sfx.play(v.act.sfx === 'siren' ? 'siren' : 'good');
  setTimeout(() => {
    sv.classList.add('acting');
    Sfx.play(v.act.sfx);
    const prop = $('#scene-svg .prop');
    if (prop) prop.classList.add('solved');
    const st = $('#scene-stars');
    if (st) st.classList.add('show');
    FX.burst(box.left + box.width*.55, box.top + box.height*.45, 70);
    showReward();
    const pi = (Math.random()*L.praise.length)|0;
    Voice.say([
      { k:'sw_' + sc.id, t:sc.win, lang:'zh' },
      { k:'praise_' + pi, t:L.praise[pi], lang:'zh' }
    ]);
  }, 2100);
  state.nextTimer = setTimeout(() => {
    if ($('#view-play').classList.contains('active')) nextScene();
  }, 7200);
}
function sceneWrong(optEl) {
  const v = byId(optEl.dataset.id), sc = state.scene;
  optEl.classList.remove('wiggle'); void optEl.offsetWidth; optEl.classList.add('wiggle');
  Sfx.play('bad');
  Voice.say([
    { k:'w_' + v.id, t:'这是' + v.zh + '，', lang:'zh' },
    { k:'play_wrong', t:L.play_wrong, lang:'zh' }
  ]);
}

/* —— 拖拽 —— */
const Drag = { el:null, id:null, moved:false, sx:0, sy:0 };
function dragStart(e) {
  if (state.playBusy) return;
  const opt = e.target.closest('.p-opt');
  if (!opt) return;
  e.preventDefault();
  Drag.el = opt; Drag.id = opt.dataset.id; Drag.moved = false;
  Drag.sx = e.clientX; Drag.sy = e.clientY;
  opt.setPointerCapture && opt.setPointerCapture(e.pointerId);
}
function dragMove(e) {
  if (!Drag.el) return;
  if (!Drag.moved && Math.hypot(e.clientX - Drag.sx, e.clientY - Drag.sy) > 10) {
    Drag.moved = true;
    const g = $('#ghost');
    g.classList.remove('back');
    g.innerHTML = svgOf(byId(Drag.id));
    g.style.display = 'block';
    Drag.el.classList.add('dragging');
    Sfx.play('tap');
  }
  if (Drag.moved) {
    const g = $('#ghost');
    g.style.left = (e.clientX - 85) + 'px';
    g.style.top = (e.clientY - 70) + 'px';
  }
}
function dragEnd(e) {
  if (!Drag.el) return;
  const opt = Drag.el, id = Drag.id, moved = Drag.moved;
  Drag.el = null;
  opt.classList.remove('dragging');
  const g = $('#ghost');
  if (!moved) {
    g.style.display = 'none';
    Sfx.play('tap');
    Voice.say([{ k:'play_hint', t:L.play_hint, lang:'zh' }]);
    opt.classList.remove('wiggle'); void opt.offsetWidth; opt.classList.add('wiggle');
    return;
  }
  const box = $('#scene-box').getBoundingClientRect();
  const inScene = e.clientX > box.left && e.clientX < box.right && e.clientY > box.top && e.clientY < box.bottom;
  if (inScene && id === state.scene.v) {
    g.style.display = 'none';
    sceneWin(opt);
  } else {
    const r = opt.getBoundingClientRect();
    g.classList.add('back');
    g.style.left = (r.left + r.width/2 - 85) + 'px';
    g.style.top = (r.top + r.height/2 - 70) + 'px';
    setTimeout(() => { g.style.display = 'none'; g.classList.remove('back'); }, 380);
    if (inScene) sceneWrong(opt);
  }
}

/* ================= 视图切换 ================= */
function setView(name) {
  clearTimeout(state.nextTimer);
  Voice.stop();
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  $('#view-' + name).classList.add('active');
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === name));
  if (name === 'quiz') newQuiz();
  if (name === 'play') nextScene();
}

/* ================= 事件绑定 ================= */
function bind() {
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => { Sfx.play('tap'); setView(t.dataset.view); });
  });
  $('#grid').addEventListener('click', e => {
    const card = e.target.closest('.card');
    if (card) openDetail(card.dataset.id);
  });
  $('#btn-close').addEventListener('click', closeDetail);
  $('#d-fig').addEventListener('click', doAction);
  $('#quiz-opts').addEventListener('click', e => {
    const opt = e.target.closest('.opt');
    if (opt) onPick(opt);
  });
  $('#btn-q-say').addEventListener('click', () => { Sfx.play('tap'); askQuiz(); });
  $('#btn-s-say').addEventListener('click', () => { Sfx.play('tap'); askScene(); });
  const po = $('#play-opts');
  po.addEventListener('pointerdown', dragStart);
  addEventListener('pointermove', dragMove);
  addEventListener('pointerup', dragEnd);
  addEventListener('pointercancel', dragEnd);
  $('#btn-start').addEventListener('click', () => {
    Sfx.init(); Sfx.play('good');
    Speech.init();
    Voice.say([{ k:'welcome', t:L.welcome, lang:'zh' }]);
    $('#start').style.display = 'none';
  });
}

/* ================= 启动 ================= */
function initIcons() {
  const tabs = document.querySelectorAll('.tab');
  tabs[0].innerHTML = ICONS.book + '<span>认一认</span>';
  tabs[1].innerHTML = ICONS.search + '<span>找一找</span>';
  tabs[2].innerHTML = ICONS.game + '<span>玩一玩</span>';

  $('#btn-q-say').innerHTML = '<span style="color:#fff">' + ICONS.speaker + '</span>';
  $('#btn-s-say').innerHTML = '<span style="color:#fff">' + ICONS.speaker + '</span>';
  $('#btn-start').querySelector('.ic').outerHTML = ICONS.play;
  $('#tap-hint').innerHTML = ICONS.hand + '点一点车车，看它干活！';
  $('#start-hero').innerHTML = svgOf(VEHICLES[0]);
  $('#start-title').textContent = KID_NAME + '认车车';
  $('#start-sub').textContent = (KID_EN ? KID_EN + "'s Cars · " : '') + '认识车车学英语';
  document.title = KID_NAME + '认车车' + (KID_EN ? ' · ' + KID_EN + "'s Cars" : '');
}
Speech.init();
FX.init();
initIcons();
renderGrid();
bind();
